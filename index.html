<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>옷장살리기 — 안 입는 옷의 재발견</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="logo">옷장<span>살리기</span></div>
      <button class="btn-closet" onclick="openCloset()">👗 내 옷장</button>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-badge">♻️ 재활용 × 패션</div>
      <h1>안 입는 옷에<br /><em>새 인생을</em> 줘봐</h1>
      <p>
        버려두기엔 아까운 그 옷, AI가 새로운 코디와 업사이클링 방법을
        알려드릴게요.
      </p>
    </section>

    <!-- FORM SECTION -->
    <section class="form-section" id="formSection">
      <div class="form-card">
        <!-- 종류 -->
        <div class="form-group">
          <label class="form-label">옷 종류 <span class="req">*</span></label>
          <div class="chips" id="chips-type">
            <button class="chip" onclick="toggleChip(this, 'type')">상의</button>
            <button class="chip" onclick="toggleChip(this, 'type')">하의</button>
            <button class="chip" onclick="toggleChip(this, 'type')">아우터</button>
            <button class="chip" onclick="toggleChip(this, 'type')">원피스/투피스</button>
            <button class="chip" onclick="toggleChip(this, 'type')">가방/잡화</button>
            <button class="chip" onclick="toggleChip(this, 'type')">기타</button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 색상 -->
        <div class="form-group">
          <label class="form-label">색상</label>
          <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
            <div class="color-swatches" id="swatches">
              <div class="swatch" style="background: #ffffff; border: 1.5px solid #e2ddd4" title="화이트" onclick="selectColor(this, '화이트')"></div>
              <div class="swatch" style="background: #2a2a22" title="블랙" onclick="selectColor(this, '블랙')"></div>
              <div class="swatch" style="background: #8b7b6b" title="베이지/브라운" onclick="selectColor(this, '베이지')"></div>
              <div class="swatch" style="background: #4a6fa5" title="블루" onclick="selectColor(this, '블루')"></div>
              <div class="swatch" style="background: #6b8e6b" title="그린" onclick="selectColor(this, '그린')"></div>
              <div class="swatch" style="background: #c96a3a" title="오렌지/레드" onclick="selectColor(this, '레드/오렌지')"></div>
              <div class="swatch" style="background: #c9a0c9" title="퍼플/핑크" onclick="selectColor(this, '퍼플/핑크')"></div>
              <div class="swatch" style="background: #a8a8a0" title="그레이" onclick="selectColor(this, '그레이')"></div>
            </div>
            <input class="color-text" type="text" id="colorText" placeholder="또는 직접 입력" oninput="clearSwatches()" />
          </div>
        </div>

        <div class="divider"></div>

        <!-- 소재 -->
        <div class="form-group">
          <label class="form-label">소재</label>
          <div class="chips" id="chips-material">
            <button class="chip" onclick="toggleChip(this, 'material')">면/코튼</button>
            <button class="chip" onclick="toggleChip(this, 'material')">폴리에스터</button>
            <button class="chip" onclick="toggleChip(this, 'material')">데님</button>
            <button class="chip" onclick="toggleChip(this, 'material')">니트/울</button>
            <button class="chip" onclick="toggleChip(this, 'material')">린넨</button>
            <button class="chip" onclick="toggleChip(this, 'material')">가죽/합성가죽</button>
            <button class="chip" onclick="toggleChip(this, 'material')">잘 모르겠어요</button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 이유 -->
        <div class="form-group">
          <label class="form-label">안 입는 이유 <span class="req">*</span></label>
          <div class="chips" id="chips-reason">
            <button class="chip" onclick="toggleChip(this, 'reason')">질렸어요</button>
            <button class="chip" onclick="toggleChip(this, 'reason')">몸에 안 맞아요</button>
            <button class="chip" onclick="toggleChip(this, 'reason')">유행이 지났어요</button>
            <button class="chip" onclick="toggleChip(this, 'reason')">색이 안 맞아요</button>
            <button class="chip" onclick="toggleChip(this, 'reason')">상태가 좋지 않아요</button>
            <button class="chip" onclick="toggleChip(this, 'reason')">그냥요</button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 추가 설명 -->
        <div class="form-group">
          <label class="form-label">옷 설명 (선택)</label>
          <textarea
            class="form-textarea"
            id="description"
            placeholder="디자인, 패턴, 핏 등 자세히 설명할수록 더 정확한 추천을 받을 수 있어요.&#10;예) 오버핏 체크 셔츠인데 어깨가 너무 넓어서 안 입게 됐어요"
          ></textarea>
        </div>

        <button class="btn-analyze" id="analyzeBtn" onclick="analyze()">
          ✨ AI로 새 인생 찾아주기
        </button>
      </div>
    </section>

    <!-- LOADING -->
    <div class="loading-state" id="loadingState">
      <div class="loading-ring"></div>
      <p class="loading-text" id="loadingText">AI가 옷을 분석하고 있어요...</p>
    </div>

    <!-- RESULT SECTION -->
    <section class="result-section" id="resultSection">
      <div class="result-header">
        <h2>분석 완료! 🎉</h2>
        <p class="result-sub">이 옷에 딱 맞는 방법을 찾았어요</p>
        <div class="result-tags" id="resultTags"></div>
      </div>

      <div class="result-grid">
        <div class="result-card" id="coordCard">
          <div class="result-card-header">
            <div class="card-icon icon-coord">👗</div>
            <div>
              <div class="card-title">코디 추천</div>
              <div class="card-sub">새로운 스타일링 아이디어</div>
            </div>
          </div>
          <div class="result-content" id="coordContent"></div>
        </div>

        <div class="result-card" id="upcycleCard">
          <div class="result-card-header">
            <div class="card-icon icon-upcycle">✂️</div>
            <div>
              <div class="card-title">업사이클링 가이드</div>
              <div class="card-sub">새 아이템으로 변신</div>
            </div>
          </div>
          <div class="result-content" id="upcycleContent"></div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn-save" id="saveBtn" onclick="saveToCloset()">💾 내 옷장에 저장</button>
        <button class="btn-reset" onclick="reset()">다른 옷 분석하기</button>
      </div>
    </section>

    <!-- 내 옷장 MODAL -->
    <div class="overlay" id="overlay" onclick="closeIfOverlay(event)">
      <div class="modal">
        <div class="modal-head">
          <h2 class="modal-title">내 옷장</h2>
          <button class="modal-close" onclick="closeCloset()">✕</button>
        </div>
        <div id="closetList"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

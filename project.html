<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>버리지마 — 옷장살리기</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --w: #fafaf8;
        --b: #0f0f0e;
        --g2: #e0e0dc;
        --g3: #ababab;
        --g4: #6a6a68;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--w);
        color: var(--b);
        min-height: 100vh;
      }
      .pf {
        font-family: "Playfair Display", serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2.5rem;
        height: 56px;
        border-bottom: 1px solid var(--g2);
        background: var(--w);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .btn-sm {
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        padding: 7px 16px;
        border: 1px solid var(--g3);
        background: transparent;
        color: var(--b);
        cursor: pointer;
        transition: border-color 0.15s;
        font-family: "DM Sans", sans-serif;
      }
      .btn-sm:hover {
        border-color: var(--b);
      }
      .hero {
        padding: 6rem 2.5rem 4.5rem;
        border-bottom: 1px solid var(--g2);
      }
      .hero h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(4rem, 11vw, 9rem);
        font-weight: 700;
        line-height: 0.88;
        letter-spacing: -0.04em;
      }
      .hero h1 em {
        font-style: italic;
        font-weight: 400;
        color: var(--g3);
      }
      .hero-foot {
        margin-top: 2.5rem;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .hero-desc {
        font-size: 0.85rem;
        color: var(--g4);
        line-height: 1.8;
        font-weight: 300;
        max-width: 260px;
      }
      .hero-tag {
        font-size: 0.62rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--g3);
        text-align: right;
        line-height: 2;
      }
      .form-section {
        max-width: 860px;
        margin: 0 auto;
        padding: 4rem 2.5rem 6rem;
      }
      .form-row {
        display: grid;
        grid-template-columns: 140px 1fr;
        border-top: 1px solid var(--g2);
        padding: 2rem 0;
      }
      .form-row.last {
        border-bottom: 1px solid var(--g2);
      }
      .row-num {
        font-size: 0.58rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--g3);
        margin-bottom: 4px;
      }
      .row-name {
        font-family: "Playfair Display", serif;
        font-size: 0.9rem;
      }
      .row-name em {
        font-style: italic;
        color: var(--g3);
        font-size: 0.85em;
      }
      .upload-area {
        border: 1.5px dashed var(--g2);
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .upload-area:hover {
        border-color: var(--b);
      }
      .upload-icon {
        font-size: 1.4rem;
        margin-bottom: 0.4rem;
      }
      .upload-label {
        font-size: 0.8rem;
        color: var(--g4);
        font-weight: 300;
      }
      .upload-sub {
        font-size: 0.7rem;
        color: var(--g3);
        margin-top: 4px;
      }
      .img-preview {
        position: relative;
        display: inline-block;
      }
      .img-preview img {
        width: 120px;
        height: 120px;
        object-fit: cover;
        display: block;
      }
      .img-remove {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 22px;
        height: 22px;
        background: var(--b);
        color: var(--w);
        border: none;
        cursor: pointer;
        font-size: 0.7rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        padding: 7px 14px;
        border: 1px solid var(--g2);
        background: transparent;
        color: var(--g4);
        font-family: "DM Sans", sans-serif;
        font-size: 0.8rem;
        font-weight: 300;
        cursor: pointer;
        transition: all 0.12s;
      }
      .chip:hover {
        border-color: var(--b);
        color: var(--b);
      }
      .chip.active {
        border-color: var(--b);
        background: var(--b);
        color: var(--w);
        font-weight: 400;
      }
      .swatch-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .swatch {
        width: 22px;
        height: 22px;
        border: 2px solid transparent;
        cursor: pointer;
        transition: all 0.12s;
      }
      .swatch:hover {
        transform: scale(1.1);
      }
      .swatch.active {
        outline: 2px solid var(--b);
        outline-offset: 2px;
        transform: scale(1.1);
      }
      .color-input {
        font-size: 0.8rem;
        padding: 7px 12px;
        border: 1px solid var(--g2);
        background: transparent;
        font-family: "DM Sans", sans-serif;
        outline: none;
        width: 120px;
      }
      .color-input:focus {
        border-color: var(--b);
      }
      .form-textarea {
        width: 100%;
        padding: 12px 0;
        border: none;
        border-bottom: 1px solid var(--g2);
        background: transparent;
        font-family: "DM Sans", sans-serif;
        font-size: 0.84rem;
        font-weight: 300;
        color: var(--b);
        resize: none;
        min-height: 60px;
        outline: none;
        line-height: 1.8;
      }
      .form-textarea::placeholder {
        color: var(--g3);
      }
      .submit-area {
        margin-top: 3.5rem;
        display: flex;
        align-items: center;
        gap: 2rem;
      }
      .btn-analyze {
        padding: 13px 44px;
        background: var(--b);
        color: var(--w);
        border: none;
        font-family: "DM Sans", sans-serif;
        font-size: 0.84rem;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .btn-analyze:hover {
        opacity: 0.7;
      }
      .submit-hint {
        font-size: 0.7rem;
        color: var(--g3);
        font-weight: 300;
      }
      .loading-state {
        display: none;
        text-align: center;
        padding: 8rem 2rem;
      }
      .loading-bar-wrap {
        width: 180px;
        height: 1px;
        background: var(--g2);
        margin: 0 auto 2rem;
        overflow: hidden;
      }
      .loading-bar {
        height: 100%;
        background: var(--b);
        animation: barslide 1.6s ease-in-out infinite;
      }
      @keyframes barslide {
        0% {
          transform: scaleX(0);
          transform-origin: left;
        }
        49% {
          transform: scaleX(1);
          transform-origin: left;
        }
        50% {
          transform: scaleX(1);
          transform-origin: right;
        }
        100% {
          transform: scaleX(0);
          transform-origin: right;
        }
      }
      .loading-text {
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--g3);
        transition: opacity 0.3s;
      }
      .error-state {
        display: none;
        text-align: center;
        padding: 6rem 2rem;
      }
      .error-msg {
        font-size: 0.84rem;
        color: var(--g4);
        margin-bottom: 1.5rem;
        line-height: 1.7;
      }
      .result-section {
        display: none;
        max-width: 860px;
        margin: 0 auto;
        padding: 4rem 2.5rem 6rem;
      }
      .result-head {
        margin-bottom: 3rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--g2);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
      }
      .result-head h2 {
        font-family: "Playfair Display", serif;
        font-size: clamp(2.2rem, 5vw, 4rem);
        font-weight: 400;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .result-head h2 em {
        font-style: italic;
        color: var(--g3);
      }
      #resultImg img {
        width: 90px;
        height: 90px;
        object-fit: cover;
      }
      .result-tags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .result-tag {
        font-size: 0.68rem;
        color: var(--g4);
        border: 1px solid var(--g2);
        padding: 3px 9px;
        font-weight: 300;
      }
      .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-bottom: 2.5rem;
      }
      @media (max-width: 560px) {
        .result-grid {
          grid-template-columns: 1fr;
        }
      }
      .result-card {
        border: 1px solid var(--g2);
        padding: 1.25rem 1.5rem;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.45s,
          transform 0.45s;
      }
      .result-card.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .result-card:nth-child(2) {
        transition-delay: 0.12s;
      }
      .card-label {
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--g3);
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .card-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--g2);
      }
      .coord-item {
        padding: 0.9rem 0;
        border-bottom: 1px solid var(--g2);
        display: flex;
        gap: 1rem;
        align-items: flex-start;
      }
      .coord-item:last-child {
        border-bottom: none;
      }
      .coord-num {
        font-size: 0.6rem;
        letter-spacing: 0.15em;
        color: var(--g3);
        padding-top: 3px;
        min-width: 20px;
      }
      .coord-text {
        font-size: 0.84rem;
        color: var(--g4);
        line-height: 1.7;
        font-weight: 300;
      }
      .upcycle-item {
        padding: 1rem;
        background: #f5f5f3;
        margin-bottom: 0.75rem;
      }
      .upcycle-item:last-child {
        margin-bottom: 0;
      }
      .badge {
        display: inline-block;
        font-size: 0.62rem;
        letter-spacing: 0.12em;
        padding: 3px 8px;
        border: 1px solid var(--g2);
        color: var(--g4);
        margin-bottom: 0.5rem;
      }
      .upcycle-title {
        font-size: 0.88rem;
        font-weight: 500;
        margin-bottom: 0.4rem;
      }
      .upcycle-desc {
        font-size: 0.8rem;
        color: var(--g4);
        line-height: 1.7;
        font-weight: 300;
      }
      .result-actions {
        display: flex;
        gap: 1rem;
        padding-top: 2rem;
        border-top: 1px solid var(--g2);
      }
      .btn-save {
        padding: 11px 24px;
        border: 1px solid var(--b);
        background: transparent;
        color: var(--b);
        font-family: "DM Sans", sans-serif;
        font-size: 0.78rem;
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn-save:hover {
        background: var(--b);
        color: var(--w);
      }
      .btn-save.saved {
        border-color: var(--g3);
        color: var(--g3);
        cursor: default;
      }
      .btn-reset {
        padding: 11px 24px;
        border: 1px solid var(--g2);
        background: transparent;
        color: var(--g4);
        font-family: "DM Sans", sans-serif;
        font-size: 0.78rem;
        cursor: pointer;
        transition: all 0.15s;
      }
      .btn-reset:hover {
        border-color: var(--g4);
        color: var(--b);
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 15, 14, 0.55);
        z-index: 200;
        display: none;
        align-items: flex-end;
        justify-content: center;
      }
      .overlay.open {
        display: flex;
      }
      .modal {
        background: var(--w);
        border-top: 1px solid var(--b);
        width: 100%;
        max-width: 860px;
        max-height: 72vh;
        overflow-y: auto;
        padding: 2rem 2.5rem;
        animation: slideUp 0.22s ease;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        padding-bottom: 1.2rem;
        border-bottom: 1px solid var(--g2);
      }
      .modal-close {
        font-size: 0.78rem;
        color: var(--g3);
        background: none;
        border: none;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
      }
      .modal-close:hover {
        color: var(--b);
      }
      .closet-empty {
        text-align: center;
        padding: 3rem;
        color: var(--g3);
        font-size: 0.84rem;
        font-weight: 300;
      }
      .closet-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.9rem 0;
        border-bottom: 1px solid var(--g2);
        cursor: pointer;
        transition: padding 0.12s;
      }
      .closet-item:hover {
        padding-left: 8px;
      }
      .closet-item:last-child {
        border-bottom: none;
      }
      .closet-name {
        font-size: 0.85rem;
        flex: 1;
      }
      .closet-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .closet-chip {
        font-size: 0.66rem;
        color: var(--g3);
        border: 1px solid var(--g2);
        padding: 2px 7px;
      }
      .closet-date {
        font-size: 0.7rem;
        color: var(--g3);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="pf" style="font-size: 1rem">옷장살리기</div>
      <button class="btn-sm" id="closetBtn">내 옷장</button>
    </header>

    <section class="hero">
      <h1 class="pf">버리지<br /><em>마라.</em></h1>
      <div class="hero-foot">
        <p class="hero-desc">
          안 입는 옷에도 가능성이 있다.<br />사진을 올리거나 정보를 입력하면<br />AI가
          코디와 업사이클링을 알려드릴게요.
        </p>
        <div class="hero-tag">재활용 × 패션<br />AI Powered</div>
      </div>
    </section>

    <section class="form-section" id="formSection">
      <div class="form-row">
        <div>
          <div class="row-num">00</div>
          <div class="row-name pf">사진 <em>선택</em></div>
        </div>
        <div id="uploadArea">
          <div class="upload-area" id="uploadBox">
            <div class="upload-icon">↑</div>
            <div class="upload-label">사진 올리기</div>
            <div class="upload-sub">옷을 직접 보고 분석해드릴게요</div>
          </div>
          <input
            type="file"
            id="fileInput"
            accept="image/*"
            style="display: none"
          />
        </div>
      </div>
      <div class="form-row">
        <div>
          <div class="row-num">01</div>
          <div class="row-name pf">종류</div>
        </div>
        <div class="chips">
          <button class="chip" data-group="type">상의</button>
          <button class="chip" data-group="type">하의</button>
          <button class="chip" data-group="type">아우터</button>
          <button class="chip" data-group="type">원피스/투피스</button>
          <button class="chip" data-group="type">가방/잡화</button>
          <button class="chip" data-group="type">기타</button>
        </div>
      </div>
      <div class="form-row" id="colorRow">
        <div>
          <div class="row-num">02</div>
          <div class="row-name pf">색상</div>
        </div>
        <div>
          <div class="swatch-row">
            <div
              class="swatch"
              style="background: #f5f5f0; border: 1px solid #ccc"
              data-color="화이트"
            ></div>
            <div
              class="swatch"
              style="background: #1c1c1a"
              data-color="블랙"
            ></div>
            <div
              class="swatch"
              style="background: #8b7b6b"
              data-color="베이지"
            ></div>
            <div
              class="swatch"
              style="background: #4a6fa5"
              data-color="블루"
            ></div>
            <div
              class="swatch"
              style="background: #6b8e6b"
              data-color="그린"
            ></div>
            <div
              class="swatch"
              style="background: #b85c38"
              data-color="레드/오렌지"
            ></div>
            <div
              class="swatch"
              style="background: #c9a0c9"
              data-color="퍼플/핑크"
            ></div>
            <div
              class="swatch"
              style="background: #a8a8a0"
              data-color="그레이"
            ></div>
          </div>
          <input
            class="color-input"
            type="text"
            id="colorText"
            placeholder="직접 입력"
          />
        </div>
      </div>
      <div class="form-row">
        <div>
          <div class="row-num">03</div>
          <div class="row-name pf">소재</div>
        </div>
        <div class="chips">
          <button class="chip" data-group="material">면/코튼</button>
          <button class="chip" data-group="material">폴리에스터</button>
          <button class="chip" data-group="material">데님</button>
          <button class="chip" data-group="material">니트/울</button>
          <button class="chip" data-group="material">린넨</button>
          <button class="chip" data-group="material">가죽/합성가죽</button>
          <button class="chip" data-group="material">잘 모르겠어요</button>
        </div>
      </div>
      <div class="form-row">
        <div>
          <div class="row-num">04</div>
          <div class="row-name pf">이유 <em>*</em></div>
        </div>
        <div class="chips">
          <button class="chip" data-group="reason">질렸어요</button>
          <button class="chip" data-group="reason">몸에 안 맞아요</button>
          <button class="chip" data-group="reason">유행이 지났어요</button>
          <button class="chip" data-group="reason">색이 안 맞아요</button>
          <button class="chip" data-group="reason">상태가 좋지 않아요</button>
          <button class="chip" data-group="reason">그냥요</button>
        </div>
      </div>
      <div class="form-row last">
        <div>
          <div class="row-num">05</div>
          <div class="row-name pf">설명</div>
        </div>
        <textarea
          class="form-textarea"
          id="description"
          placeholder="추가로 알려주실 게 있나요?"
        ></textarea>
      </div>
      <div class="submit-area">
        <button class="btn-analyze" id="analyzeBtn">분석 시작</button>
        <span class="submit-hint">04 이유는 필수예요</span>
      </div>
    </section>

    <div class="loading-state" id="loadingState">
      <div class="loading-bar-wrap"><div class="loading-bar"></div></div>
      <p class="loading-text" id="loadingText">분석하는 중</p>
    </div>

    <div class="error-state" id="errorState">
      <p class="error-msg" id="errorMsg"></p>
      <button class="btn-analyze" id="retryBtn">다시 시도</button>
    </div>

    <section class="result-section" id="resultSection">
      <div class="result-head">
        <div id="resultImg"></div>
        <h2 class="pf" id="resultTitle">분석<br /><em>완료.</em></h2>
        <div class="result-tags" id="resultTags"></div>
      </div>
      <div class="result-grid">
        <div class="result-card" id="coordCard">
          <div class="card-label">01 코디 추천</div>
          <div id="coordContent"></div>
        </div>
        <div class="result-card" id="upcycleCard">
          <div class="card-label">02 업사이클링</div>
          <div id="upcycleContent"></div>
        </div>
      </div>
      <div class="result-actions" id="resultActions">
        <button class="btn-save" id="saveBtn">내 옷장에 저장</button>
        <button class="btn-reset" id="resetBtn">다른 옷 분석하기</button>
      </div>
    </section>

    <div class="overlay" id="overlay">
      <div class="modal">
        <div class="modal-head">
          <div class="pf" style="font-size: 1.1rem">내 옷장</div>
          <button class="modal-close" id="modalClose">✕ 닫기</button>
        </div>
        <div id="closetList"></div>
      </div>
    </div>

    <script>
      const LOADING_MSGS = [
        "분석하는 중",
        "코디 찾는 중",
        "업사이클링 탐색 중",
        "거의 다 됐어요",
      ];
      const sel = { type: null, material: null, reason: null, color: null };
      let imageFile = null,
        currentResult = null,
        saved = false;
      let closet = JSON.parse(localStorage.getItem("wardrobe_closet") || "[]");

      function resetUploadArea() {
        document.getElementById("colorRow").style.display = "";
        document.getElementById("uploadArea").innerHTML =
          '<div class="upload-area" id="uploadBox"><div class="upload-icon">↑</div><div class="upload-label">사진 올리기</div><div class="upload-sub">옷을 직접 보고 분석해드릴게요</div></div><input type="file" id="fileInput" accept="image/*" style="display:none"/>';
        document
          .getElementById("uploadBox")
          .addEventListener("click", function () {
            document.getElementById("fileInput").click();
          });
        document
          .getElementById("fileInput")
          .addEventListener("change", handleFile);
      }

      function handleFile(e) {
        const file = e.target.files[0];
        if (!file || !file.type.startsWith("image/")) return;
        imageFile = file;
        const url = URL.createObjectURL(file);
        document.getElementById("colorRow").style.display = "none";
        document.getElementById("uploadArea").innerHTML =
          '<div class="img-preview"><img src="' +
          url +
          '" alt="업로드"/><button class="img-remove" id="removeImg">✕</button></div>';
        document
          .getElementById("removeImg")
          .addEventListener("click", function () {
            imageFile = null;
            resetUploadArea();
          });
      }

      document
        .getElementById("uploadBox")
        .addEventListener("click", function () {
          document.getElementById("fileInput").click();
        });
      document
        .getElementById("fileInput")
        .addEventListener("change", handleFile);

      document.querySelectorAll(".chip").forEach(function (c) {
        c.addEventListener("click", function () {
          document
            .querySelectorAll('[data-group="' + this.dataset.group + '"]')
            .forEach(function (x) {
              x.classList.remove("active");
            });
          this.classList.add("active");
          sel[this.dataset.group] = this.textContent.trim();
        });
      });

      document.querySelectorAll(".swatch").forEach(function (s) {
        s.addEventListener("click", function () {
          document.querySelectorAll(".swatch").forEach(function (x) {
            x.classList.remove("active");
          });
          this.classList.add("active");
          sel.color = this.dataset.color;
          document.getElementById("colorText").value = "";
        });
      });

      document
        .getElementById("colorText")
        .addEventListener("input", function () {
          document.querySelectorAll(".swatch").forEach(function (s) {
            s.classList.remove("active");
          });
          sel.color = this.value;
        });

      async function detectMediaType(file) {
        const b = new Uint8Array(await file.slice(0, 12).arrayBuffer());
        if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46)
          return "image/webp";
        if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47)
          return "image/png";
        if (b[0] === 0xff && b[1] === 0xd8) return "image/jpeg";
        if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return "image/gif";
        return "image/jpeg";
      }

      function toBase64(file) {
        return new Promise(function (res, rej) {
          const r = new FileReader();
          r.onload = function () {
            res(r.result.split(",")[1]);
          };
          r.onerror = function () {
            rej(new Error("파일 읽기 실패"));
          };
          r.readAsDataURL(file);
        });
      }

      function parseResult(text) {
        const coordSection = (text.match(
          /\[코디추천\]([\s\S]*?)(?=\[업사이클링\]|$)/,
        ) || ["", ""])[1].trim();
        const upcycleSection = (text.match(/\[업사이클링\]([\s\S]*?)$/) || [
          "",
          "",
        ])[1].trim();
        const coords = coordSection
          .split(/\n(?=\d+\.)/)
          .filter(Boolean)
          .slice(0, 3)
          .map(function (s) {
            return s.replace(/^\d+\.\s*/, "").trim();
          });
        const upcycles = upcycleSection
          .split(/\n(?=\d+\.)/)
          .filter(Boolean)
          .slice(0, 2)
          .map(function (s) {
            const lines = s
              .replace(/^\d+\.\s*/, "")
              .trim()
              .split("\n")
              .filter(Boolean);
            const title = lines[0];
            const rest = lines.slice(1).join(" ");
            const dm = rest.match(/난이도[:\s]*(쉬움|보통|어려움)/);
            return {
              title: title,
              desc: rest
                .replace(/난이도[:\s]*(쉬움|보통|어려움)[.,\s]*/g, "")
                .trim(),
              diff: dm ? dm[1] : "",
            };
          });
        return {
          coords: coords.length ? coords : [coordSection],
          upcycles: upcycles.length
            ? upcycles
            : [{ title: "업사이클링", desc: upcycleSection, diff: "" }],
        };
      }

      function showPhase(phase) {
        document.getElementById("formSection").style.display =
          phase === "form" ? "block" : "none";
        document.getElementById("loadingState").style.display =
          phase === "loading" ? "block" : "none";
        document.getElementById("errorState").style.display =
          phase === "error" ? "block" : "none";
        document.getElementById("resultSection").style.display =
          phase === "result" ? "block" : "none";
      }

      async function analyze() {
        if (!sel.reason) {
          alert("안 입는 이유를 선택해주세요!");
          return;
        }
        showPhase("loading");
        let mi = 0;
        const timer = setInterval(function () {
          mi = (mi + 1) % LOADING_MSGS.length;
          const el = document.getElementById("loadingText");
          el.style.opacity = "0";
          setTimeout(function () {
            el.textContent = LOADING_MSGS[mi];
            el.style.opacity = "1";
          }, 200);
        }, 1800);

        const colorVal =
          document.getElementById("colorText").value || sel.color;
        const desc = document.getElementById("description").value;
        const prompt =
          "당신은 패션 스타일리스트이자 업사이클링 전문가입니다.\n" +
          (imageFile ? "첨부된 사진의 옷을 분석해주세요.\n" : "") +
          "아래 정보를 참고해 한국어로 조언해주세요.\n\n" +
          "옷 정보:\n" +
          "- 종류: " +
          (sel.type || (imageFile ? "사진 참고" : "미상")) +
          "\n" +
          "- 색상: " +
          (colorVal || (imageFile ? "사진 참고" : "미상")) +
          "\n" +
          "- 소재: " +
          (sel.material || "미상") +
          "\n" +
          "- 안 입는 이유: " +
          sel.reason +
          "\n" +
          "- 추가 설명: " +
          (desc || "없음") +
          "\n\n" +
          "아래 형식으로 정확히 답변하세요. 각 항목은 1-2문장으로 간결하게 써주세요.\n\n" +
          "[코디추천]\n" +
          "1. (스타일명): 한두 문장으로 코디 방법\n" +
          "2. (스타일명): 한두 문장으로 코디 방법\n" +
          "3. (스타일명): 한두 문장으로 코디 방법\n\n" +
          "[업사이클링]\n" +
          "1. (아이템명)\n난이도: 쉬움/보통/어려움\n한두 문장으로 만드는 방법\n\n" +
          "2. (아이템명)\n난이도: 쉬움/보통/어려움\n한두 문장으로 만드는 방법";

        try {
          const res = await fetch(
            "https://factchat-cloud.mindlogic.ai/v1/gateway/chat/completions/",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer r97fGStawn0rX2QenegVGVUK5E9JQWbF",
              },
              body: JSON.stringify({
                model: "gpt-5.4-nano",
                max_tokens: 800,
                messages: [{ role: "user", content: prompt }],
              }),
            },
          );
          const data = await res.json();
          if (!res.ok || !data.choices || !data.choices[0])
            throw new Error(
              (data.error && data.error.message) || "오류 " + res.status,
            );
          const parsed = parseResult(data.choices[0].message.content);

          currentResult = Object.assign({}, parsed, {
            type: sel.type,
            color: colorVal,
            material: sel.material,
            reason: sel.reason,
            date: new Date().toLocaleDateString("ko-KR"),
            id: Date.now(),
            imageUrl: imageFile ? URL.createObjectURL(imageFile) : null,
          });
          saved = false;
          clearInterval(timer);

          const tags = [sel.type, colorVal, sel.material, sel.reason].filter(
            Boolean,
          );
          document.getElementById("resultTags").innerHTML = tags
            .map(function (t) {
              return '<span class="result-tag">' + t + "</span>";
            })
            .join("");
          document.getElementById("resultImg").innerHTML =
            currentResult.imageUrl
              ? '<img src="' + currentResult.imageUrl + '"/>'
              : "";
          document.getElementById("coordContent").innerHTML = parsed.coords
            .map(function (c, i) {
              return (
                '<div class="coord-item"><span class="coord-num">0' +
                (i + 1) +
                '</span><span class="coord-text">' +
                c +
                "</span></div>"
              );
            })
            .join("");
          document.getElementById("upcycleContent").innerHTML = parsed.upcycles
            .map(function (u) {
              return (
                '<div class="upcycle-item">' +
                (u.diff
                  ? '<span class="badge">난이도 ' + u.diff + "</span>"
                  : "") +
                '<div class="upcycle-title">' +
                u.title +
                '</div><div class="upcycle-desc">' +
                u.desc +
                "</div></div>"
              );
            })
            .join("");
          document.getElementById("saveBtn").textContent = "내 옷장에 저장";
          document.getElementById("saveBtn").classList.remove("saved");
          document.getElementById("resultTitle").style.display = "";
          document.getElementById("resultActions").innerHTML =
            '<button class="btn-save" id="saveBtn">내 옷장에 저장</button>' +
            '<button class="btn-reset" id="resetBtn">다른 옷 분석하기</button>' +
            '<button class="btn-reset" id="genImgBtn">✨ 코디 이미지 생성</button>';
          document
            .getElementById("saveBtn")
            .addEventListener("click", saveToCloset);
          document.getElementById("resetBtn").addEventListener("click", reset);
          document
            .getElementById("genImgBtn")
            .addEventListener("click", generateImage); // 추가
          document
            .getElementById("saveBtn")
            .addEventListener("click", saveToCloset);
          document.getElementById("resetBtn").addEventListener("click", reset);
          showPhase("result");
          setTimeout(function () {
            document.getElementById("coordCard").classList.add("visible");
            document.getElementById("upcycleCard").classList.add("visible");
          }, 80);
        } catch (err) {
          clearInterval(timer);
          document.getElementById("errorMsg").textContent = err.message;
          showPhase("error");
        }
      }

      function reset() {
        sel.type = sel.material = sel.reason = sel.color = null;
        imageFile = null;
        currentResult = null;
        saved = false;
        document.querySelectorAll(".chip").forEach(function (c) {
          c.classList.remove("active");
        });
        document.querySelectorAll(".swatch").forEach(function (s) {
          s.classList.remove("active");
        });
        document.getElementById("colorText").value = "";
        document.getElementById("description").value = "";
        document.getElementById("coordCard").classList.remove("visible");
        document.getElementById("upcycleCard").classList.remove("visible");
        resetUploadArea();
        showPhase("form");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function saveToCloset() {
        if (!currentResult || saved) return;
        closet.unshift(currentResult);
        localStorage.setItem("wardrobe_closet", JSON.stringify(closet));
        saved = true;
        const btn = document.getElementById("saveBtn");
        btn.textContent = "저장됐어요 ✓";
        btn.classList.add("saved");
      }

      function closeCloset() {
        document.getElementById("overlay").classList.remove("open");
      }

      function openCloset() {
        const list = document.getElementById("closetList");
        if (!closet.length) {
          list.innerHTML =
            '<div class="closet-empty">아직 저장된 옷이 없어요<br/><br/>분석 후 저장하면 여기에 모여요</div>';
        } else {
          list.innerHTML = closet
            .map(function (item) {
              return (
                '<div class="closet-item" data-id="' +
                item.id +
                '">' +
                (item.imageUrl
                  ? '<img src="' +
                    item.imageUrl +
                    '" style="width:44px;height:44px;object-fit:cover;margin-right:12px;flex-shrink:0;">'
                  : "") +
                '<span class="closet-name">' +
                (item.type || "") +
                (item.color ? " · " + item.color : "") +
                "</span>" +
                '<div class="closet-meta">' +
                [item.material, item.reason]
                  .filter(Boolean)
                  .map(function (t) {
                    return '<span class="closet-chip">' + t + "</span>";
                  })
                  .join("") +
                '<span class="closet-date">' +
                item.date +
                "</span>" +
                '<button class="delete-btn" data-id="' +
                item.id +
                '" style="margin-left:8px;font-size:.7rem;color:var(--g3);background:none;border:none;cursor:pointer;">✕</button>' +
                "</div></div>"
              );
            })
            .join("");
          document.querySelectorAll(".closet-item").forEach(function (el) {
            el.addEventListener("click", function () {
              loadItem(Number(el.dataset.id));
            });
          });
          document.querySelectorAll(".delete-btn").forEach(function (btn) {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              closet = closet.filter(function (i) {
                return i.id !== Number(btn.dataset.id);
              });
              localStorage.setItem("wardrobe_closet", JSON.stringify(closet));
              openCloset();
            });
          });
        }
        document.getElementById("overlay").classList.add("open");
      }

      function loadItem(id) {
        const item = closet.find(function (i) {
          return i.id === id;
        });
        if (!item) return;
        closeCloset();
        currentResult = item;
        saved = true;
        const tags = [item.type, item.color, item.material, item.reason].filter(
          Boolean,
        );
        document.getElementById("resultTags").innerHTML = tags
          .map(function (t) {
            return '<span class="result-tag">' + t + "</span>";
          })
          .join("");
        document.getElementById("resultImg").innerHTML = item.imageUrl
          ? '<img src="' + item.imageUrl + '"/>'
          : "";
        document.getElementById("coordContent").innerHTML = (item.coords || [])
          .map(function (c, i) {
            return (
              '<div class="coord-item"><span class="coord-num">0' +
              (i + 1) +
              '</span><span class="coord-text">' +
              c +
              "</span></div>"
            );
          })
          .join("");
        document.getElementById("upcycleContent").innerHTML = (
          item.upcycles || []
        )
          .map(function (u) {
            return (
              '<div class="upcycle-item">' +
              (u.diff
                ? '<span class="badge">난이도 ' + u.diff + "</span>"
                : "") +
              '<div class="upcycle-title">' +
              u.title +
              '</div><div class="upcycle-desc">' +
              u.desc +
              "</div></div>"
            );
          })
          .join("");
        document.getElementById("saveBtn").textContent = "저장됐어요 ✓";
        document.getElementById("saveBtn").classList.add("saved");
        document.getElementById("coordCard").classList.remove("visible");
        document.getElementById("upcycleCard").classList.remove("visible");
        document.getElementById("resultTitle").style.display = "none";
        document.getElementById("resultActions").innerHTML =
          '<button class="btn-reset" onclick="closeClosetView()">옷장 닫기</button>';
        showPhase("result");
        setTimeout(function () {
          document.getElementById("coordCard").classList.add("visible");
          document.getElementById("upcycleCard").classList.add("visible");
        }, 80);
      }
      function closeClosetView() {
        showPhase("form");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function generateImage() {
        const btn = document.getElementById("genImgBtn");
        btn.textContent = "생성 중...";
        btn.disabled = true;

        const prompt =
          "패션 코디 사진, " +
          (currentResult.type || "옷") +
          (currentResult.color ? ", " + currentResult.color + " 색상" : "") +
          ", 깔끔한 스튜디오 배경, 트렌디한 스타일";

        try {
          const res = await fetch(
            "https://factchat-cloud.mindlogic.ai/v1/gateway/images/generations/",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer r97fGStawn0rX2QenegVGVUK5E9JQWbF",
              },
              body: JSON.stringify({
                model: "dall-e-1",
                prompt: prompt,
                n: 1,
                size: "1024x1024",
              }),
            },
          );
          const data = await res.json();
          const imgUrl = data.data[0].url;
          document.getElementById("resultImg").innerHTML =
            '<img src="' +
            imgUrl +
            '" style="width:200px;height:200px;object-fit:cover;"/>';
          btn.textContent = "✨ 코디 이미지 생성";
          btn.disabled = false;
        } catch (err) {
          btn.textContent = "오류 발생";
          btn.disabled = false;
        }
      }

      document.getElementById("analyzeBtn").addEventListener("click", analyze);
      document
        .getElementById("retryBtn")
        .addEventListener("click", function () {
          showPhase("form");
        });
      document.getElementById("resetBtn").addEventListener("click", reset);
      document
        .getElementById("saveBtn")
        .addEventListener("click", saveToCloset);
      document
        .getElementById("closetBtn")
        .addEventListener("click", openCloset);
      document
        .getElementById("modalClose")
        .addEventListener("click", closeCloset);
      document
        .getElementById("overlay")
        .addEventListener("click", function (e) {
          if (e.target === this) closeCloset();
        });
    </script>
  </body>
</html>

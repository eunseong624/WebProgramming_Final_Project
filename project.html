<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>옷장살리기 — 안 입는 옷의 재발견</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f7f4ed;
        --bg-card: #ffffff;
        --primary: #1e3a2f;
        --primary-soft: #2d5444;
        --accent: #c96a3a;
        --accent-light: #f5dfd0;
        --text: #1a1a16;
        --text-muted: #7a7a70;
        --border: #e2ddd4;
        --radius: 20px;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.6;
      }

      /* ── HEADER ── */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(247, 244, 237, 0.9);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0 2rem;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--primary);
        letter-spacing: -0.02em;
      }
      .logo span {
        color: var(--accent);
      }

      .btn-closet {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 18px;
        border: 1.5px solid var(--primary);
        border-radius: 100px;
        background: transparent;
        color: var(--primary);
        font-family: "Noto Sans KR", sans-serif;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-closet:hover {
        background: var(--primary);
        color: white;
      }

      /* ── HERO ── */
      .hero {
        padding: 5rem 2rem 3rem;
        max-width: 720px;
        margin: 0 auto;
        text-align: center;
      }

      .hero-badge {
        display: inline-block;
        padding: 6px 16px;
        background: var(--accent-light);
        color: var(--accent);
        border-radius: 100px;
        font-size: 0.8rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
        letter-spacing: 0.03em;
      }

      .hero h1 {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.6rem, 6vw, 4rem);
        font-weight: 600;
        line-height: 1.15;
        color: var(--primary);
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
      }
      .hero h1 em {
        font-style: italic;
        color: var(--accent);
      }

      .hero p {
        font-size: 1rem;
        color: var(--text-muted);
        max-width: 460px;
        margin: 0 auto 3rem;
        line-height: 1.8;
      }

      /* ── FORM ── */
      .form-section {
        max-width: 680px;
        margin: 0 auto;
        padding: 0 2rem 8rem;
      }

      .form-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 8px 48px rgba(30, 58, 47, 0.07);
      }

      .form-group {
        margin-bottom: 2rem;
      }
      .form-group:last-child {
        margin-bottom: 0;
      }

      .form-label {
        display: block;
        font-size: 0.88rem;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 0.75rem;
      }
      .form-label .req {
        color: var(--accent);
        margin-left: 2px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        padding: 8px 16px;
        border: 1.5px solid var(--border);
        border-radius: 100px;
        background: transparent;
        color: var(--text-muted);
        font-family: "Noto Sans KR", sans-serif;
        font-size: 0.85rem;
        font-weight: 400;
        cursor: pointer;
        transition: all 0.18s;
        user-select: none;
      }
      .chip:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: rgba(30, 58, 47, 0.04);
      }
      .chip.active {
        border-color: var(--primary);
        background: var(--primary);
        color: white;
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin: 2rem 0;
      }

      .color-input-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .color-swatches {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .swatch {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition: transform 0.15s;
      }
      .swatch:hover {
        transform: scale(1.15);
      }
      .swatch.active {
        border-color: var(--text);
        transform: scale(1.1);
      }

      .color-text {
        font-size: 0.85rem;
        color: var(--text-muted);
        padding: 8px 12px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
        font-family: "Noto Sans KR", sans-serif;
        outline: none;
        width: 140px;
        transition: border-color 0.2s;
      }
      .color-text:focus {
        border-color: var(--primary);
      }

      .form-textarea {
        width: 100%;
        padding: 14px 16px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
        font-family: "Noto Sans KR", sans-serif;
        font-size: 0.9rem;
        color: var(--text);
        resize: vertical;
        min-height: 96px;
        outline: none;
        transition: border-color 0.2s;
        line-height: 1.7;
      }
      .form-textarea:focus {
        border-color: var(--primary);
      }
      .form-textarea::placeholder {
        color: var(--text-muted);
      }

      .btn-analyze {
        width: 100%;
        padding: 18px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 16px;
        font-family: "Noto Sans KR", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 2rem;
        letter-spacing: -0.01em;
      }
      .btn-analyze:hover {
        background: var(--primary-soft);
        transform: translateY(-2px);
        box-shadow: 0 10px 36px rgba(30, 58, 47, 0.22);
      }
      .btn-analyze:active {
        transform: translateY(0);
      }
      .btn-analyze:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* ── LOADING ── */
      .loading-state {
        text-align: center;
        padding: 6rem 2rem;
        display: none;
      }

      .loading-ring {
        width: 56px;
        height: 56px;
        margin: 0 auto 2rem;
        border: 3px solid var(--border);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-text {
        font-size: 1rem;
        color: var(--text-muted);
        transition: opacity 0.3s;
      }

      /* ── RESULT ── */
      .result-section {
        max-width: 680px;
        margin: 0 auto;
        padding: 0 2rem 8rem;
        display: none;
      }

      .result-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .result-header h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: 2.2rem;
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 0.4rem;
      }
      .result-sub {
        font-size: 0.88rem;
        color: var(--text-muted);
      }
      .result-tags {
        display: flex;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 0.75rem;
      }
      .result-tag {
        padding: 4px 12px;
        border-radius: 100px;
        background: var(--accent-light);
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 500;
      }

      .result-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.25rem;
      }
      @media (max-width: 540px) {
        .result-grid {
          grid-template-columns: 1fr;
        }
      }

      .result-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 1.75rem;
        box-shadow: 0 4px 30px rgba(30, 58, 47, 0.05);
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.45s,
          transform 0.45s;
      }
      .result-card:nth-child(2) {
        transition-delay: 0.1s;
      }
      .result-card.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .result-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 1.25rem;
      }

      .card-icon {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      .icon-coord {
        background: rgba(30, 58, 47, 0.1);
      }
      .icon-upcycle {
        background: rgba(201, 106, 58, 0.1);
      }

      .card-title {
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--text);
      }
      .card-sub {
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: 1px;
      }

      .result-content {
        font-size: 0.88rem;
        color: var(--text);
        line-height: 1.85;
        white-space: pre-wrap;
      }

      .action-row {
        display: flex;
        gap: 10px;
        margin-bottom: 0;
      }

      .btn-save {
        flex: 1;
        padding: 15px;
        border: 2px solid var(--accent);
        border-radius: 14px;
        background: transparent;
        color: var(--accent);
        font-family: "Noto Sans KR", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-save:hover {
        background: var(--accent);
        color: white;
      }

      .btn-reset {
        flex: 1;
        padding: 15px;
        border: 1.5px solid var(--border);
        border-radius: 14px;
        background: transparent;
        color: var(--text-muted);
        font-family: "Noto Sans KR", sans-serif;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-reset:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      /* ── MODAL ── */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 200;
        display: none;
        align-items: flex-end;
        justify-content: center;
      }
      .overlay.open {
        display: flex;
      }

      .modal {
        background: var(--bg-card);
        border-radius: 24px 24px 0 0;
        width: 100%;
        max-width: 680px;
        max-height: 78vh;
        overflow-y: auto;
        padding: 2rem;
        animation: slideUp 0.28s ease;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }
      .modal-title {
        font-family: "Cormorant Garamond", serif;
        font-size: 1.6rem;
        font-weight: 600;
        color: var(--primary);
      }
      .modal-close {
        width: 32px;
        height: 32px;
        border: none;
        background: #eceae2;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
      }

      .closet-empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .closet-item {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.1rem 1.25rem;
        margin-bottom: 0.75rem;
        cursor: pointer;
        transition: all 0.15s;
      }
      .closet-item:hover {
        border-color: var(--primary);
        background: rgba(30, 58, 47, 0.02);
      }

      .closet-item-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .closet-item-name {
        font-weight: 500;
        font-size: 0.9rem;
      }
      .closet-item-date {
        font-size: 0.78rem;
        color: var(--text-muted);
      }

      .closet-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .closet-chip {
        padding: 3px 10px;
        border-radius: 100px;
        background: #eceae2;
        color: var(--text-muted);
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="logo">옷장<span>살리기</span></div>
      <button class="btn-closet" onclick="openCloset()">👗 내 옷장</button>
    </header>

    <!-- HERO -->
    <section class="hero">
      <div class="hero-badge">♻️ 재활용 × 패션</div>
      <h1>안 입는 옷에<br /><em>새 인생을</em> 줘봐</h1>
      <p>
        버려두기엔 아까운 그 옷, AI가 새로운 코디와 업사이클링 방법을
        알려드릴게요.
      </p>
    </section>

    <!-- FORM SECTION -->
    <section class="form-section" id="formSection">
      <div class="form-card">
        <!-- 종류 -->
        <div class="form-group">
          <label class="form-label">옷 종류 <span class="req">*</span></label>
          <div class="chips" id="chips-type">
            <button class="chip" onclick="toggleChip(this, 'type')">
              상의
            </button>
            <button class="chip" onclick="toggleChip(this, 'type')">
              하의
            </button>
            <button class="chip" onclick="toggleChip(this, 'type')">
              아우터
            </button>
            <button class="chip" onclick="toggleChip(this, 'type')">
              원피스/투피스
            </button>
            <button class="chip" onclick="toggleChip(this, 'type')">
              가방/잡화
            </button>
            <button class="chip" onclick="toggleChip(this, 'type')">
              기타
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 색상 -->
        <div class="form-group">
          <label class="form-label">색상</label>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 12px;
              flex-wrap: wrap;
            "
          >
            <div class="color-swatches" id="swatches">
              <div
                class="swatch"
                style="background: #ffffff; border: 1.5px solid #e2ddd4"
                title="화이트"
                onclick="selectColor(this, '화이트')"
              ></div>
              <div
                class="swatch"
                style="background: #2a2a22"
                title="블랙"
                onclick="selectColor(this, '블랙')"
              ></div>
              <div
                class="swatch"
                style="background: #8b7b6b"
                title="베이지/브라운"
                onclick="selectColor(this, '베이지')"
              ></div>
              <div
                class="swatch"
                style="background: #4a6fa5"
                title="블루"
                onclick="selectColor(this, '블루')"
              ></div>
              <div
                class="swatch"
                style="background: #6b8e6b"
                title="그린"
                onclick="selectColor(this, '그린')"
              ></div>
              <div
                class="swatch"
                style="background: #c96a3a"
                title="오렌지/레드"
                onclick="selectColor(this, '레드/오렌지')"
              ></div>
              <div
                class="swatch"
                style="background: #c9a0c9"
                title="퍼플/핑크"
                onclick="selectColor(this, '퍼플/핑크')"
              ></div>
              <div
                class="swatch"
                style="background: #a8a8a0"
                title="그레이"
                onclick="selectColor(this, '그레이')"
              ></div>
            </div>
            <input
              class="color-text"
              type="text"
              id="colorText"
              placeholder="또는 직접 입력"
              oninput="clearSwatches()"
            />
          </div>
        </div>

        <div class="divider"></div>

        <!-- 소재 -->
        <div class="form-group">
          <label class="form-label">소재</label>
          <div class="chips" id="chips-material">
            <button class="chip" onclick="toggleChip(this, 'material')">
              면/코튼
            </button>
            <button class="chip" onclick="toggleChip(this, 'material')">
              폴리에스터
            </button>
            <button class="chip" onclick="toggleChip(this, 'material')">
              데님
            </button>
            <button class="chip" onclick="toggleChip(this, 'material')">
              니트/울
            </button>
            <button class="chip" onclick="toggleChip(this, 'material')">
              린넨
            </button>
            <button class="chip" onclick="toggleChip(this, 'material')">
              가죽/합성가죽
            </button>
            <button class="chip" onclick="toggleChip(this, 'material')">
              잘 모르겠어요
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 이유 -->
        <div class="form-group">
          <label class="form-label"
            >안 입는 이유 <span class="req">*</span></label
          >
          <div class="chips" id="chips-reason">
            <button class="chip" onclick="toggleChip(this, 'reason')">
              질렸어요
            </button>
            <button class="chip" onclick="toggleChip(this, 'reason')">
              몸에 안 맞아요
            </button>
            <button class="chip" onclick="toggleChip(this, 'reason')">
              유행이 지났어요
            </button>
            <button class="chip" onclick="toggleChip(this, 'reason')">
              색이 안 맞아요
            </button>
            <button class="chip" onclick="toggleChip(this, 'reason')">
              상태가 좋지 않아요
            </button>
            <button class="chip" onclick="toggleChip(this, 'reason')">
              그냥요
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- 추가 설명 -->
        <div class="form-group">
          <label class="form-label">옷 설명 (선택)</label>
          <textarea
            class="form-textarea"
            id="description"
            placeholder="디자인, 패턴, 핏 등 자세히 설명할수록 더 정확한 추천을 받을 수 있어요.&#10;예) 오버핏 체크 셔츠인데 어깨가 너무 넓어서 안 입게 됐어요"
          ></textarea>
        </div>

        <button class="btn-analyze" id="analyzeBtn" onclick="analyze()">
          ✨ AI로 새 인생 찾아주기
        </button>
      </div>
    </section>

    <!-- LOADING -->
    <div class="loading-state" id="loadingState">
      <div class="loading-ring"></div>
      <p class="loading-text" id="loadingText">AI가 옷을 분석하고 있어요...</p>
    </div>

    <!-- RESULT SECTION -->
    <section class="result-section" id="resultSection">
      <div class="result-header">
        <h2>분석 완료! 🎉</h2>
        <p class="result-sub">이 옷에 딱 맞는 방법을 찾았어요</p>
        <div class="result-tags" id="resultTags"></div>
      </div>

      <div class="result-grid">
        <div class="result-card" id="coordCard">
          <div class="result-card-header">
            <div class="card-icon icon-coord">👗</div>
            <div>
              <div class="card-title">코디 추천</div>
              <div class="card-sub">새로운 스타일링 아이디어</div>
            </div>
          </div>
          <div class="result-content" id="coordContent"></div>
        </div>

        <div class="result-card" id="upcycleCard">
          <div class="result-card-header">
            <div class="card-icon icon-upcycle">✂️</div>
            <div>
              <div class="card-title">업사이클링 가이드</div>
              <div class="card-sub">새 아이템으로 변신</div>
            </div>
          </div>
          <div class="result-content" id="upcycleContent"></div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn-save" id="saveBtn" onclick="saveToCloset()">
          💾 내 옷장에 저장
        </button>
        <button class="btn-reset" onclick="reset()">다른 옷 분석하기</button>
      </div>
    </section>

    <!-- 내 옷장 MODAL -->
    <div class="overlay" id="overlay" onclick="closeIfOverlay(event)">
      <div class="modal">
        <div class="modal-head">
          <h2 class="modal-title">내 옷장</h2>
          <button class="modal-close" onclick="closeCloset()">✕</button>
        </div>
        <div id="closetList"></div>
      </div>
    </div>

    <script>
      // ── 상태 ──
      const sel = { type: null, material: null, reason: null, color: null };
      let currentResult = null;

      const loadingMsgs = [
        "AI가 옷을 분석하고 있어요...",
        "코디 조합을 생각하는 중...",
        "업사이클링 아이디어를 찾는 중...",
        "거의 다 됐어요! 잠깐만요...",
      ];

      // ── 칩 토글 ──
      function toggleChip(el, group) {
        document
          .querySelectorAll(`#chips-${group} .chip`)
          .forEach((c) => c.classList.remove("active"));
        el.classList.add("active");
        sel[group] = el.textContent;
      }

      // ── 색상 스와치 ──
      function selectColor(el, name) {
        document
          .querySelectorAll(".swatch")
          .forEach((s) => s.classList.remove("active"));
        el.classList.add("active");
        sel.color = name;
        document.getElementById("colorText").value = "";
      }

      function clearSwatches() {
        document
          .querySelectorAll(".swatch")
          .forEach((s) => s.classList.remove("active"));
        sel.color = document.getElementById("colorText").value;
      }

      // ── API 호출 ──
      async function analyze() {
        if (!sel.type) {
          alert("옷 종류를 선택해주세요!");
          return;
        }
        if (!sel.reason) {
          alert("안 입는 이유를 선택해주세요!");
          return;
        }

        const colorVal =
          document.getElementById("colorText").value || sel.color;
        const desc = document.getElementById("description").value;

        // UI 전환
        document.getElementById("formSection").style.display = "none";
        document.getElementById("resultSection").style.display = "none";
        const loading = document.getElementById("loadingState");
        loading.style.display = "block";

        let mi = 0;
        const timer = setInterval(() => {
          mi = (mi + 1) % loadingMsgs.length;
          const el = document.getElementById("loadingText");
          el.style.opacity = "0";
          setTimeout(() => {
            el.textContent = loadingMsgs[mi];
            el.style.opacity = "1";
          }, 200);
        }, 1800);

        const prompt = `당신은 패션 스타일리스트이자 업사이클링 전문가입니다.
사용자의 옷 정보를 보고 실용적이고 따라하기 쉬운 조언을 한국어로 해주세요.

옷 정보:
- 종류: ${sel.type}
- 색상: ${colorVal || "미상"}
- 소재: ${sel.material || "미상"}
- 안 입는 이유: ${sel.reason}
- 추가 설명: ${desc || "없음"}

아래 형식으로 정확히 답변하세요. 마크다운 기호 없이 깔끔한 텍스트로만 작성하세요.

[코디추천]
이 옷을 활용한 새로운 코디 방법 3가지를 구체적으로 알려주세요. 어떤 아이템과 매치하면 좋은지, 어떤 분위기가 연출되는지 자세히 설명해주세요. 실용적이고 지금 트렌드에 맞는 스타일링을 추천해주세요.

[업사이클링]
이 옷을 새로운 아이템으로 만드는 방법 2가지를 알려주세요. 각각 난이도(쉬움/보통/어려움), 필요한 재료, 핵심 제작 과정을 설명해주세요.`;

        try {
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=여기에API키`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
              }),
            },
          );

          const data = await res.json();
          const text = data.candidates[0].content.parts[0].text;

          const coordMatch = text.match(
            /\[코디추천\]([\s\S]*?)(?=\[업사이클링\]|$)/,
          );
          const upcycleMatch = text.match(/\[업사이클링\]([\s\S]*?)$/);

          const coordText = coordMatch
            ? coordMatch[1].trim()
            : "코디 정보를 불러오지 못했어요.";
          const upcycleText = upcycleMatch
            ? upcycleMatch[1].trim()
            : "업사이클링 정보를 불러오지 못했어요.";

          currentResult = {
            type: sel.type,
            color: colorVal,
            material: sel.material,
            reason: sel.reason,
            description: desc,
            coord: coordText,
            upcycle: upcycleText,
            date: new Date().toLocaleDateString("ko-KR"),
            id: Date.now(),
          };

          clearInterval(timer);
          loading.style.display = "none";

          // 결과 태그
          const tags = [sel.type, colorVal, sel.material, sel.reason].filter(
            Boolean,
          );
          document.getElementById("resultTags").innerHTML = tags
            .map((t) => `<span class="result-tag">${t}</span>`)
            .join("");

          document.getElementById("coordContent").textContent = coordText;
          document.getElementById("upcycleContent").textContent = upcycleText;
          document.getElementById("saveBtn").textContent = "💾 내 옷장에 저장";

          const rs = document.getElementById("resultSection");
          rs.style.display = "block";
          setTimeout(() => {
            document.getElementById("coordCard").classList.add("visible");
            document.getElementById("upcycleCard").classList.add("visible");
          }, 80);
          rs.scrollIntoView({ behavior: "smooth", block: "start" });
        } catch (err) {
          clearInterval(timer);
          loading.style.display = "none";
          document.getElementById("formSection").style.display = "block";
          alert("오류가 발생했어요. 다시 시도해주세요.\n" + err.message);
        }
      }

      // ── 초기화 ──
      function reset() {
        currentResult = null;
        sel.type = sel.material = sel.reason = sel.color = null;
        document
          .querySelectorAll(".chip")
          .forEach((c) => c.classList.remove("active"));
        document
          .querySelectorAll(".swatch")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById("description").value = "";
        document.getElementById("colorText").value = "";
        document.getElementById("coordCard").classList.remove("visible");
        document.getElementById("upcycleCard").classList.remove("visible");
        document.getElementById("resultSection").style.display = "none";
        document.getElementById("formSection").style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // ── 저장 ──
      function saveToCloset() {
        if (!currentResult) return;
        const closet = JSON.parse(
          localStorage.getItem("wardrobe_closet") || "[]",
        );
        const exists = closet.find((i) => i.id === currentResult.id);
        if (!exists) {
          closet.unshift(currentResult);
          localStorage.setItem("wardrobe_closet", JSON.stringify(closet));
        }
        const btn = document.getElementById("saveBtn");
        btn.textContent = "✅ 저장됐어요!";
        btn.style.cssText = "border-color:#1E3A2F; color:#1E3A2F;";
        setTimeout(() => {
          btn.textContent = "💾 내 옷장에 저장";
          btn.style.cssText = "";
        }, 2200);
      }

      // ── 내 옷장 ──
      function openCloset() {
        const closet = JSON.parse(
          localStorage.getItem("wardrobe_closet") || "[]",
        );
        const list = document.getElementById("closetList");
        if (!closet.length) {
          list.innerHTML =
            '<div class="closet-empty">아직 저장된 옷이 없어요 👗<br><br>분석 후 저장하면 여기에 모여요!</div>';
        } else {
          list.innerHTML = closet
            .map(
              (item) => `
        <div class="closet-item" onclick="loadItem(${item.id})">
          <div class="closet-item-top">
            <span class="closet-item-name">${item.type}${item.color ? " · " + item.color : ""}${item.description ? " — " + item.description.slice(0, 22) + (item.description.length > 22 ? "..." : "") : ""}</span>
            <span class="closet-item-date">${item.date}</span>
          </div>
          <div class="closet-chips">
            ${[item.material, item.reason]
              .filter(Boolean)
              .map((t) => `<span class="closet-chip">${t}</span>`)
              .join("")}
          </div>
        </div>
      `,
            )
            .join("");
        }
        document.getElementById("overlay").classList.add("open");
      }

      function closeCloset() {
        document.getElementById("overlay").classList.remove("open");
      }
      function closeIfOverlay(e) {
        if (e.target.id === "overlay") closeCloset();
      }

      function loadItem(id) {
        const closet = JSON.parse(
          localStorage.getItem("wardrobe_closet") || "[]",
        );
        const item = closet.find((i) => i.id === id);
        if (!item) return;
        closeCloset();

        currentResult = item;
        const tags = [item.type, item.color, item.material, item.reason].filter(
          Boolean,
        );
        document.getElementById("resultTags").innerHTML = tags
          .map((t) => `<span class="result-tag">${t}</span>`)
          .join("");
        document.getElementById("coordContent").textContent = item.coord;
        document.getElementById("upcycleContent").textContent = item.upcycle;
        document.getElementById("coordCard").classList.remove("visible");
        document.getElementById("upcycleCard").classList.remove("visible");
        document.getElementById("formSection").style.display = "none";
        const rs = document.getElementById("resultSection");
        rs.style.display = "block";
        setTimeout(() => {
          document.getElementById("coordCard").classList.add("visible");
          document.getElementById("upcycleCard").classList.add("visible");
        }, 80);
        rs.scrollIntoView({ behavior: "smooth" });
      }
    </script>
  </body>
</html>
